# pytest configuration for Conexus Caller ID Backend
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --asyncio-mode=auto

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database, Redis)
    performance: Performance tests (latency, throughput)
    security: Security tests (auth, rate limit, PoW)
    contract: Contract tests (API schemas)

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning