[workspace]
resolver = "2"
members = [
    "antispam-core",
    "antispam-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/conexus-systems/antispam"
authors = ["Tiago Antoniazi <tiago.antoniazi@gmail.com>"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# Crypto
ed25519-dalek = "2.1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = "1.8"

# Compression
flate2 = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async
tokio = { version = "1.38", features = ["full"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Collections
indexmap = "2.0"
smallvec = "1.12"

# Testing
proptest = "1.4"

# Android JNI
jni = "0.21"

# Web framework (for API)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database (for API)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Config
config = { version = "0.14", features = ["toml", "env"] }

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.12"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Base64
base64 = "0.22"

# Hex
hex = "0.4"

# Regex
regex = "1.10"

# Lazy static
lazy_static = "1.4"