# GitHub release com APK Android, sem EAS e sem EXPO_TOKEN.
#
# Gera o projeto nativo (expo prebuild), compila `assembleRelease` no runner e publica uma
# pré-release no GitHub com o APK. O template do Expo assina o release com a chave de debug:
# serve para instalar e testar fora da Play, NÃO substitui nem atualiza a versão da Play
# (essa continua saindo pelo eas-build.yml, com a chave de upload).
#
# Uso: Actions → GitHub release (APK) → Run workflow.
name: GitHub release (APK)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: github-release-apk
  cancel-in-progress: false

defaults:
  run:
    working-directory: .

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # client_id PÚBLICO do OAuthClient "AntiSpam BR" no Auth BFF (Settings → Variables → CONEXUS_CLIENT_ID).
      # Vazio ou ausente = login com a Conta Conexus desligado no APK (o app mostra "Em breve").
      EXPO_PUBLIC_CONEXUS_CLIENT_ID: ${{ vars.CONEXUS_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list still asks for 'tools', which the SDK no longer ships.
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Version
        run: |
          set -euo pipefail
          version="$(npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version||"0.0.0"))')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=android-v$version-b${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="${{ github.event.repository.name }}-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "APK Android gerado no GitHub Actions a partir de \`${GITHUB_SHA::7}\` (versão $VERSION)."
            echo
            echo "Assinado com a chave de **debug** do template Expo: instale manualmente para testar."
            echo "Não atualiza a versão da Play; desinstale-a antes, se estiver instalada."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`"
          } > notes.md
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" \
            --title "Android $VERSION (build ${{ github.run_number }})" --notes-file notes.md --prerelease
